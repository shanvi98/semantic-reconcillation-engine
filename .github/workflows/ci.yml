name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch supersedes the run already in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI runs the offline, deterministic stack: no model download, no API key,
  # no network. A green tick here has to mean the logic is correct, not that
  # a hosted model happened to be reachable.
  RECON_TEST_USE_REAL_STACK: "false"
  RECON_USE_REAL_EMBEDDINGS: "false"
  RECON_USE_REAL_LLM: "false"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - name: Lint
        run: ruff check --output-format=github .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Core + dev only. The engine and the whole suite run without the
      # multi-hundred-megabyte torch/faiss wheels, so CI should not pay for them.
      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

  evaluation:
    # The accuracy gates are the project's actual claim, so they get their own
    # job: a drop in precision/recall should be legible at a glance in the
    # checks list rather than buried in the middle of a unit-test log.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e ".[dev]"

      - name: Accuracy gates (match rate, precision, recall)
        run: pytest tests/evaluation -s

      - name: End-to-end CLI run
        run: |
          python scripts/generate_data.py --n-records 60 --seed 42
          python scripts/run_reconciliation.py

      - name: Upload run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reconciliation-output
          path: |
            data/outputs/metrics.json
            data/outputs/exceptions.csv
          if-no-files-found: error
