[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-reconciliation-engine"
version = "0.2.0"
authors = [{ name = "Shanvi Kumari" }]
description = "Three-way (Bank / Razorpay Settlement / Invoice) semantic reconciliation engine"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["reconciliation", "finance-ops", "fintech", "record-linkage", "razorpay"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Accounting",
]

# Core stays deliberately light: the whole engine runs, and the full test suite
# passes, on these alone. The heavyweight ML wheels are opt-in extras so a
# clone, install, and `pytest` stays fast and works with no network access.
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
embeddings = ["faiss-cpu>=1.7.4", "sentence-transformers>=2.5"]
llm = ["anthropic>=0.40"]
app = ["streamlit>=1.35"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]
all = [
    "semantic-reconciliation-engine[embeddings,llm,app,dev]",
]

[project.scripts]
recon-generate = "reconciler.cli:generate_data"
recon-run = "reconciler.cli:run_reconciliation"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: exercises the real embedding/LLM stack (deselect with -m 'not slow')",
]
filterwarnings = ["error::DeprecationWarning:reconciler.*"]

[tool.coverage.run]
source = ["src/reconciler"]
branch = true
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "C4",   # comprehensions
    "RUF",  # ruff-specific
]
ignore = [
    "E501",    # line length is enforced by the formatter, not the linter
    "B008",    # function call in default arg — argparse/pathlib defaults are fine here
    "RUF012",  # mutable class attrs; the matcher tier constants are intentional
]

[tool.ruff.lint.per-file-ignores]
# Scripts and tests bootstrap sys.path before importing the package, so their
# imports legitimately cannot all sit at the top of the file.
"scripts/*" = ["E402"]
"tests/*" = ["E402"]
"notebooks/*" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["reconciler"]
